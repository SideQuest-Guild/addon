name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the packager creates the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff reads every tag and commit

      # The release notes are this tag's section of the changelog. The packager reads CHANGELOG.md (manual-changelog
      # in .pkgmeta) and sends it to CurseForge and GitHub.
      - name: Write release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      # Uploads to CurseForge (project id from SideQuest/SideQuest.toc) and creates the GitHub release.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
