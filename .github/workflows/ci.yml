name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon:
    name: Addon (LuaJIT tests + luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT and luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q luajit luarocks
          sudo luarocks install luacheck

      - name: Run addon test suite
        run: luajit tests/run_tests.lua

      - name: luacheck
        run: luacheck SideQuest tests

      - name: Upload export fixture
        uses: actions/upload-artifact@v4
        with:
          name: export_v1_fixture
          path: tests/fixtures/export_v1.txt

  uploader:
    name: Uploader (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Run uploader tests
        working-directory: uploader
        run: uv run --python 3.12 pytest
