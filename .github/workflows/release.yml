name: Release

# A v* tag builds the addon zip once, uploads it to CurseForge, signs build provenance and an SBOM for it, and publishes
# it as an immutable GitHub release. CurseForge and GitHub get the same file, so either download can be verified with
# `gh attestation verify`.
#
# Running the workflow by hand:
# - with a tag (e.g. v0.1.0): builds that tag and publishes it as a GitHub release only, for a version that is already
#   on CurseForge but has no GitHub release. The tag is built with the release tooling from the branch the workflow
#   runs on, since older tags predate it.
# - without a tag: a dry run. It builds and attests the zip and leaves a draft release named dry-run-<run id>. Nothing
#   goes to CurseForge, and the draft can be deleted.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish on GitHub only (blank for a dry run)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, upload to CurseForge, attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore certificate for the attestations
      attestations: write
    env:
      CURSEFORGE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # git-cliff and the packager read every tag
          persist-credentials: false

      - name: Check the tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9] ]] || [ "$(git describe --tags --exact-match)" != "$TAG" ]; then
            echo "$TAG is not a v* tag" >&2
            exit 1
          fi

      # The changelog config comes from the commit the workflow runs on, so tags made before cliff.toml existed still
      # get notes.
      - name: Get the changelog config
        run: git show "$GITHUB_SHA:cliff.toml" > "$RUNNER_TEMP/cliff.toml"

      # The release notes are this tag's section of the changelog. The packager reads CHANGELOG.md (manual-changelog in
      # .pkgmeta) and sends it to CurseForge; the GitHub release uses the same file.
      - name: Write release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: ${{ runner.temp }}/cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      # No GitHub token is passed, so the packager only uploads to CurseForge; the github-release job publishes to
      # GitHub. -d skips every upload when the workflow is run by hand.
      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: ${{ env.CURSEFORGE != 'true' && '-d' || '' }}
          pandoc: "false"
        env:
          CF_API_TOKEN: ${{ env.CURSEFORGE == 'true' && secrets.CF_API_KEY || '' }}

      - name: Find the zip
        id: zip
        run: |
          shopt -s nullglob
          zips=(.release/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected one zip in .release/, found ${#zips[@]}" >&2
            exit 1
          fi
          echo "path=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${zips[0]}" .zip)" >> "$GITHUB_OUTPUT"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # The addon has no third-party code, so the SBOM is one package with a SHA-256 for every file in the zip.
      - name: Write the SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          NAME: ${{ steps.zip.outputs.name }}
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_FILE_METADATA_DIGESTS: sha256
        run: |
          version="$(git describe --tags --always)"
          "$SYFT" scan dir:.release/SideQuest --source-name SideQuest --source-version "$version" \
            -o "spdx-json=.release/$NAME.spdx.json"

      - name: Write checksums
        working-directory: .release
        env:
          NAME: ${{ steps.zip.outputs.name }}
        run: sha256sum "$NAME.zip" "$NAME.spdx.json" > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.path }}

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.path }}
          sbom-path: .release/${{ steps.zip.outputs.name }}.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ steps.zip.outputs.path }}
            .release/${{ steps.zip.outputs.name }}.spdx.json
            .release/SHA256SUMS.txt
            CHANGELOG.md
          if-no-files-found: error
          include-hidden-files: true # .release/ starts with a dot

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # Immutable releases lock a release's assets and tag once it is published, so the release is drafted with every
      # asset attached and published in a separate step.
      - name: Draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHED_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          assets=(.release/*.zip .release/*.spdx.json .release/SHA256SUMS.txt)
          tag="${PUSHED_TAG:-$INPUT_TAG}"
          if [ -n "$tag" ]; then
            gh release create "$tag" --draft --verify-tag --title "SideQuest $tag" --notes-file CHANGELOG.md "${assets[@]}"
            gh release edit "$tag" --draft=false
          else
            gh release create "dry-run-$GITHUB_RUN_ID" --draft --target "$GITHUB_SHA" --title "Dry run $GITHUB_RUN_ID" \
              --notes-file CHANGELOG.md "${assets[@]}"
          fi
