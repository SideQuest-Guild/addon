name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  addon:
    name: Addon (LuaJIT tests + luacheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LuaJIT and luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q luajit luarocks
          sudo luarocks install luacheck

      - name: Run addon test suite
        run: luajit tests/run_tests.lua

      - name: luacheck
        run: luacheck SideQuest tests

      - name: Upload export fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export_v1_fixture
          path: tests/fixtures/export_v1.txt

  uploader:
    name: Uploader (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        run: uv python install 3.12

      - name: Run uploader tests
        working-directory: uploader
        run: uv run --locked --python 3.12 pytest
