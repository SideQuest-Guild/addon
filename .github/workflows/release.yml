name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the packager creates the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager builds the changelog from tags

      # Uploads to CurseForge (project id from SideQuest/SideQuest.toc) and creates the GitHub release.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
