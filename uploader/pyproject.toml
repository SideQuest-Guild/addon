[project]
name = "sidequest-sync"
version = "1.0.0"
description = "Uploads SideQuest addon SavedVariables EPGP exports to the SideQuest guild site."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
sidequest-sync = "sidequest_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidequest_sync"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
